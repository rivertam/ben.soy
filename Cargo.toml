[package]
name = "benjisponge"
version = "0.1.0"
edition = "2024"
# Four bins live here (the site, two sync CLIs, and the Discord bot); plain
# `cargo run` and `topcoat dev` need to keep resolving to the site.
default-run = "benjisponge"

# The diary offline queue is Rust on both sides (docs/diary-sync.md):
# `diary-core` is the shared contract + outbox logic, `diary-worker` its
# wasm32 build for the service worker. The worker is deliberately its OWN
# workspace (excluded here): its build carries a [patch] on surrealdb-core
# for a wasm-only upstream bug, and that patch must never enter this
# workspace's graph — the server always builds pristine crates.io code.
# Fitness entry has no embedded database patch, so its pure core and thin
# wasm wrapper are ordinary workspace members.
[workspace]
members = [
    "crates/diary-core",
    "crates/eastern-time",
    "crates/fitness-entry-core",
    "crates/fitness-entry-worker",
]
exclude = ["crates/diary-worker"]
resolver = "3"

[workspace.dependencies]
diary-core = { path = "crates/diary-core" }
eastern-time = { path = "crates/eastern-time" }
fitness-entry-core = { path = "crates/fitness-entry-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
surrealdb = { version = "=3.2.3", default-features = false }

# The sync CLIs and the bot are standalone crates that live WITH their
# interests — delete an interest folder and its importer goes too. They are
# not part of the site binary's module tree.
[[bin]]
name = "fitness_sync"
path = "src/app/interests/lifting/fitness_sync.rs"

[[bin]]
name = "spire_sync"
path = "src/app/interests/spire/spire_sync.rs"

# Unlike the sync CLIs this one is a long-running service, deployed from the
# same image as the site with its own start command (docs/podrick.md).
[[bin]]
name = "podrick"
path = "src/app/interests/podrick/podrick.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22"
csv = "1.3.1"
diary-core = { workspace = true, features = ["view"] }
eastern-time = { workspace = true }
fitness-entry-core = { workspace = true }
form_urlencoded = "1.2.2"
# Same crate topcoat re-exports header types from; needed whole for
# `http::request::Parts` in the viewer layer.
http = "1"
inventory = "0.3.24"
jiff = { version = "0.2.34", features = ["tzdb-bundle-always"] }
# Mints the diary direct-sync tokens (ES256; the private key env var must
# be PKCS#8 PEM — jsonwebtoken rejects SEC1 "EC PRIVATE KEY" files).
jsonwebtoken = "9"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "json",
] }
rmcp = { version = "=3.1.4", features = [
    "macros",
    "schemars",
    "server",
    "transport-streamable-http-server",
] }
schemars = "1.2.2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = "2.6.1"
surrealdb = { workspace = true, features = ["protocol-ws", "protocol-http", "rustls"] }
tokio = { version = "1.53.0", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
topcoat = { version = "0.6.2", features = ["tailwind", "font-fontsource", "tower"] }
tracing = "0.1.41"
url = "2.5.8"
uuid = { version = "1.19.0", features = ["v4"] }

[build-dependencies]
topcoat = { version = "0.6.2", default-features = false, features = ["tailwind"] }

[dev-dependencies]
surrealdb = { workspace = true, features = ["kv-mem"] }

# Full DWARF makes the SurrealDB-heavy dev and test executables enormous (the
# main test harness alone was over 700 MB). Line tables preserve useful file
# and line backtraces while substantially reducing codegen, linking, and disk
# traffic during local checks.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
