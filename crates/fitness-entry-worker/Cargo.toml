[package]
name = "fitness-entry-worker"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

# The native workspace check sees an intentionally empty crate. The real
# adapter is built only for the browser target by `just fitness-wasm`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
fitness-entry-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "=0.2.126"
