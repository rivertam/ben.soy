# Pre-commit keeps auto-formatting, a production-target Clippy pass, and the
# full test suite. CI still runs `just check` with all targets.
pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.rs"
      run: cargo fmt
      stage_fixed: true
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace -- -D warnings
    test:
      run: cargo test --workspace --quiet
